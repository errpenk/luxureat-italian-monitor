<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LuxurEat · Monitor SEO</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main class="shell">
    <section id="login" class="login-card" aria-labelledby="login-title">
      <img class="brand-logo" src="https://luxureat.cn/wp-content/themes/luxureat-wordpress-theme/assets/media/brand/luxureat-logo.png" alt="LuxurEat">
      <h1 id="login-title">Monitor SEO</h1>
      <p>Inserisci la password per visualizzare il rapporto giornaliero.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Accedi</button>
        <p id="login-error" class="error" role="alert" hidden>Password non valida.</p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <header class="topbar">
        <img class="brand-logo" src="https://luxureat.cn/wp-content/themes/luxureat-wordpress-theme/assets/media/brand/luxureat-logo.png" alt="LuxurEat">
        <form id="sync-form" class="sync-form">
          <label for="monitor-link">提交 WordPress 监控链接</label>
          <div class="sync-fields">
            <input id="monitor-link" type="url" placeholder="https://luxureat.cn/wp-admin/..." required>
            <button type="submit">提交</button>
          </div>
          <p id="sync-status" class="sync-status" role="status" hidden></p>
        </form>
      </header>
      <section class="metrics" aria-label="Indicatori principali">
        <article><span>Visite oggi</span><strong id="today-pv">—</strong></article>
        <article><span>Visite ieri</span><strong id="yesterday-pv">—</strong></article>
        <article><span>Visite questa settimana</span><strong id="week-pv">—</strong></article>
        <article><span>Visite questo mese</span><strong id="month-pv">—</strong></article>
      </section>
      <section class="grid">
        <article class="panel wide"><div class="panel-head"><h2>Andamento del traffico</h2><span>PV</span></div><div id="daily-chart" class="line-chart" aria-label="Traffico PV nelle ultime 24 ore"></div><div id="weekly-chart" class="line-chart" aria-label="Traffico PV negli ultimi 7 giorni"></div></article>
        <article class="panel"><div class="panel-head"><h2>Pagine più visitate</h2><span>PV</span></div><ol id="pages" class="ranked"><li>Nessun dato disponibile.</li></ol></article>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
