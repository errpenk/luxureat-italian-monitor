name: Update Italian monitor data

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch normalized monitor data
        env:
          MONITOR_DATA_URL: ${{ secrets.MONITOR_DATA_URL }}
          MONITOR_DATA_TOKEN: ${{ secrets.MONITOR_DATA_TOKEN }}
        run: node scripts/sync-data.mjs
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m "Update Italian monitor data"
          git push
